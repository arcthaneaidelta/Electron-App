kind = "web"
previewPath = "/"
title = "FlowDesk — Premium Desktop App"
version = "1.0.0"
id = "artifacts/flowdesk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19145

[services.development]
run = "pnpm --filter @workspace/flowdesk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flowdesk", "run", "build" ]
publicDir = "artifacts/flowdesk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19145"
BASE_PATH = "/"
